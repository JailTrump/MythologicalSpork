<!DOCTYPE html>
<html lang="en"><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metro Transit - Live Clock</title>
    <link href="css2_PUez.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .mobile-container {
            position: relative;
            width: 100%;
            max-width: 384px;
            height: 800px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            border: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
        }

        /* Status Bar */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            color: #1f2937;
            background: white;
            z-index: 10;
        }

        .status-icons {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .icon {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .battery-icon {
            width: 20px;
            height: 16px;
        }

        /* Top Navigation Bar */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            color: #6b7280;
            border-bottom: 1px solid #e5e7eb;
            background: white;
        }

        .nav-center {
            text-align: center;
            font-size: 14px;
        }

        .nav-date {
            font-weight: 600;
            color: #1f2937;
        }

        .nav-time {
            font-size: 12px;
            color: #6b7280;
        }

        /* Main Content */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px;
            background: white;
            flex-grow: 1;
            overflow-y: auto;
        }

        .title {
            font-size: 32px;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 8px;
            letter-spacing: -0.025em;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 32px;
            font-size: 14px;
        }

        /* Logo with oscillating effect */
        .logo-container {
            position: relative;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: #ff6b35;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 48px;
            box-shadow: 0 10px 25px rgba(255, 107, 53, 0.3);
            animation: oscillate 3s ease-in-out infinite;
        }

        .logo-inner {
            width: 120px;
            height: 120px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.06);
        }

        .logo-image {
            width: 80px; /* Adjust size as needed */
            height: 80px; /* Adjust size as needed */
            object-fit: contain;
        }

        /* Large Time Display */
        .large-time {
            font-size: 56px;
            font-weight: 900;
            color: #111827;
            margin-bottom: 32px;
            font-family: 'Inter', system-ui, sans-serif;
            letter-spacing: -0.025em;
            line-height: 1;
            text-align: center;
        }

        /* Reduced Button */
        .reduced-button {
            background: #16a34a;
            color: white;
            font-size: 24px;
            font-weight: 700;
            padding: 16px 64px;
            border-radius: 9999px;
            border: none;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            margin-bottom: 32px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .reduced-button:hover {
            background: #15803d;
        }

        /* Ticket Info */
        .ticket-info {
            width: 100%;
            background: #f3f4f6;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.06);
        }

        .ticket-type {
            font-size: 18px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 4px;
        }

        .ticket-area {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 8px;
        }

        .ticket-expires {
            font-size: 14px;
            color: #6b7280;
        }

        .expires-highlight {
            font-weight: 500;
            color: #374151;
        }

        /* Bottom Navigation */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 100%;
            background: white;
            border-top: 1px solid #e5e7eb;
            padding: 12px 0;
            border-radius: 0 0 24px 24px;
        }

        .nav-button {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #6b7280;
            background: none;
            border: none;
            cursor: pointer;
            transition: color 0.2s;
        }

        .nav-button:hover {
            color: #2563eb;
        }

        .nav-button-text {
            font-size: 12px;
            margin-top: 4px;
        }

        /* Animations */
        @keyframes oscillate {
            0% { 
                transform: scale(1);
                box-shadow: 0 10px 25px rgba(255, 107, 53, 0.3);
            }
            50% { 
                transform: scale(1.08);
                box-shadow: 0 15px 35px rgba(255, 107, 53, 0.4);
            }
            100% { 
                transform: scale(1);
                box-shadow: 0 10px 25px rgba(255, 107, 53, 0.3);
            }
        }

        @keyframes fadeAndScale {
            0% { 
                opacity: 0.7; 
                transform: scale(0.98); 
            }
            50% { 
                opacity: 1; 
                transform: scale(1); 
            }
            100% { 
                opacity: 1; 
                transform: scale(1); 
            }
        }

        .animate-time-tick {
            animation: fadeAndScale 0.5s ease-out;
        }

        /* Responsive adjustments */
        @media (max-width: 480px) {
            .mobile-container {
                height: 100vh;
                border-radius: 0;
                max-width: 100%;
            }
            
            .title {
                font-size: 28px;
            }
            
            .large-time {
                font-size: 48px;
            }
            
            .logo-container {
                width: 150px;
                height: 150px;
            }
            
            .logo-inner {
                width: 100px;
                height: 100px;
            }
            
            .logo-image {
                width: 70px;
                height: 70px;
            }
            
            .reduced-button {
                font-size: 20px;
                padding: 14px 48px;
            }
        }
    </style>
</head>

    <script>
        let lastSecond = '';

        function updateTimeAndDate() {
            const now = new Date();
            
            // Status bar time (24-hour format)
            const statusTime = now.toLocaleTimeString('en-US', { 
                hour: '2-digit', 
                minute: '2-digit', 
                hour12: false 
            });
            document.getElementById('statusTime').textContent = statusTime;
            
            // Navigation date and time
            const navDate = now.toLocaleDateString('en-US', { 
                month: 'long', 
                day: 'numeric' 
            });
            const navTime = now.toLocaleTimeString('en-US', { 
                hour: 'numeric', 
                minute: '2-digit', 
                hour12: true 
            });
            document.getElementById('navDate').textContent = navDate;
            document.getElementById('navTime').textContent = navTime;
            
            // Large time display
            const largeTime = now.toLocaleTimeString('en-US', { 
                hour: 'numeric', 
                minute: '2-digit', 
                second: '2-digit', 
                hour12: true 
            });
            
            const largeTimeElement = document.getElementById('largeTime');
            
            // Only update and animate if the second has changed
            const currentSecond = now.getSeconds().toString();
            if (currentSecond !== lastSecond) {
                largeTimeElement.textContent = largeTime;
                
                // Re-trigger animation by removing and adding class
                largeTimeElement.classList.remove('animate-time-tick');
                setTimeout(() => {
                    largeTimeElement.classList.add('animate-time-tick');
                }, 10);
                
                lastSecond = currentSecond;
            }
            
            // Expires date (tomorrow at 2:00 AM)
            const tomorrow = new Date(now);
            tomorrow.setDate(now.getDate() + 1);
            tomorrow.setHours(2, 0, 0, 0);
            
            const expiresDate = tomorrow.toLocaleDateString('en-US', { 
                month: 'short', 
                day: 'numeric', 
                year: 'numeric' 
            }) + ' at ' + tomorrow.toLocaleTimeString('en-US', { 
                hour: 'numeric', 
                minute: '2-digit', 
                hour12: true 
            });
            
            document.getElementById('expiresDate').textContent = expiresDate;
        }

        // Initialize and update every second
        updateTimeAndDate();
        setInterval(updateTimeAndDate, 1000);
        
        // Auto-refresh every hour
        setTimeout(() => {
            location.reload();
        }, 3600000);
    </script>
