<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Metro Transit - Live Clock</title>
    <link href="css2_PUez.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            font-family: 'Inter', Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #ffffff;
            color: #374151;
            overflow-x: hidden;
        }

        .mobile-container {
            position: relative;
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        /* Top Blue Status Strip inside phone view */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            background: #1d4ed8;
            z-index: 10;
        }

        .status-icons {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .icon {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .battery-icon {
            width: 20px;
            height: 16px;
        }

        .signal-label {
            font-size: 12px;
            font-weight: 500;
        }

        /* Top Navigation Bar */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            color: #4b5563;
            border-bottom: 1px solid #e5e7eb;
            background: #ffffff;
        }

        .nav-center {
            text-align: center;
            font-size: 14px;
        }

        .nav-date {
            font-weight: 600;
            color: #1f2937;
        }

        .nav-time {
            font-size: 12px;
            color: #6b7280;
        }

        /* Main Content */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 20px 24px 24px;
            background: #ffffff;
            flex-grow: 1;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            color: #374151;
            margin-bottom: 2px;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }

        .subtitle {
            color: #4b5563;
            margin-bottom: 36px;
            font-size: 16px;
            font-weight: 500;
        }

        /* Pulsing Lime-Green Ring with Darker Green Shading */
        .logo-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 42px;
        }

        .logo-container {
            position: relative;
            width: 204px;
            height: 204px;
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            background: radial-gradient(circle, #84cc16 62%, #65a30d 92%, #3f6212 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            transform-origin: center center;
            will-change: transform, box-shadow;
            animation: oscillate 3.2s ease-in-out infinite;
        }

        .logo-inner {
            width: 128px;
            height: 128px;
            aspect-ratio: 1 / 1;
            background: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(20, 83, 45, 0.25), inset 0 2px 5px rgba(0, 0, 0, 0.08);
        }

        .logo-image {
            width: 92px;
            height: 92px;
            object-fit: contain;
            -webkit-touch-callout: none;
            user-select: none;
        }

        /* Large Time Display */
        .large-time {
            width: 100%;
            font-size: 52px;
            font-weight: 800;
            color: #374151;
            margin-bottom: 22px;
            font-family: 'Inter', Roboto, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            letter-spacing: -0.025em;
            line-height: 1.05;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        /* Reduced Pill Button */
        .reduced-button {
            width: 100%;
            background: #15803d;
            color: #ffffff;
            font-size: 32px;
            font-weight: 600;
            padding: 12px 32px;
            border-radius: 9999px;
            border: none;
            box-shadow: 0 4px 12px rgba(20, 83, 45, 0.25);
            margin-bottom: 36px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            user-select: none;
        }

        .reduced-button:active {
            background: #166534;
        }

        /* Ticket Card Matching Screenshot Layout */
        .ticket-info {
            width: 100%;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 18px 20px;
            text-align: left;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
        }

        .ticket-type {
            font-size: 20px;
            font-weight: 600;
            color: #374151;
            line-height: 1.3;
            margin-bottom: 8px;
        }

        .ticket-area {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 18px;
        }

        .ticket-expires {
            font-size: 16px;
            font-weight: 700;
            color: #4b5563;
        }

        .expires-highlight {
            font-weight: 700;
            color: #4b5563;
        }

        /* Bottom Blue Bar inside phone view */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 100%;
            background: #1d4ed8;
            color: #ffffff;
            padding: 12px 0;
        }

        .nav-button {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #ffffff;
            background: none;
            border: none;
            cursor: pointer;
            opacity: 0.92;
            transition: opacity 0.2s ease;
            user-select: none;
        }

        .nav-button:active {
            opacity: 1;
        }

        .nav-button-text {
            font-size: 11px;
            margin-top: 4px;
        }

        /* Smooth Circle Pulse: Smaller -> Larger -> Smaller with Dark-Green Shadow */
        @keyframes oscillate {
            0% {
                transform: scale3d(0.84, 0.84, 1);
                box-shadow: 0 6px 14px rgba(20, 83, 45, 0.35), inset 0 0 0 3px rgba(21, 128, 61, 0.35);
            }
            50% {
                transform: scale3d(1.06, 1.06, 1);
                box-shadow: 0 16px 30px rgba(20, 83, 45, 0.52), inset 0 0 0 4px rgba(20, 83, 45, 0.45);
            }
            100% {
                transform: scale3d(0.84, 0.84, 1);
                box-shadow: 0 6px 14px rgba(20, 83, 45, 0.35), inset 0 0 0 3px rgba(21, 128, 61, 0.35);
            }
        }

        @keyframes fadeAndScale {
            0% {
                opacity: 0.85;
                transform: scale(0.99);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .animate-time-tick {
            animation: fadeAndScale 0.35s ease-out;
        }

        @media (max-width: 390px) {
            .logo-container {
                width: 188px;
                height: 188px;
            }

            .logo-inner {
                width: 118px;
                height: 118px;
            }

            .logo-image {
                width: 84px;
                height: 84px;
            }

            .large-time {
                font-size: 46px;
            }

            .reduced-button {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="mobile-container">
        <!-- Top Bar -->
        <div class="status-bar">
            <span id="statusTime">18:22</span>
            <div class="status-icons">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M2 17h20v2H2zm1.15-4.05L4 11.47l.85 1.48L3.15 12.95zm3.7-3.7L8 8.47l1.15 1.48L7.85 9.25zm3.7-3.7L12 4.47l1.15 1.48L11.85 5.55zm3.7-3.7L16 .47l1.15 1.48L15.85 1.85z"></path>
                </svg>
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
                    <path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
                    <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                    <path d="M12 20h.01"></path>
                </svg>
                <span class="signal-label">5G</span>
                <svg class="battery-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="1" y="6" width="18" height="12" rx="2" ry="2"></rect>
                    <path d="M23 13v-2"></path>
                    <rect x="3" y="8" width="14" height="8" rx="1" ry="1" fill="currentColor"></rect>
                </svg>
            </div>
        </div>

        <!-- Top Navigation -->
        <div class="top-nav">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M15 18l-6-6 6-6"></path>
            </svg>
            <div class="nav-center">
                <div class="nav-date" id="navDate">November 23</div>
                <div class="nav-time" id="navTime">6:22 PM</div>
            </div>
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <h1 class="title">Metro Transit</h1>
            <p class="subtitle">Show operator your ticket</p>

            <!-- Pulsing Circle Logo -->
            <div class="logo-wrapper">
                <div class="logo-container">
                    <div class="logo-inner">
                        <img src="go_to_logo_PUez.png" alt="Go To Logo" class="logo-image">
                    </div>
                </div>
            </div>

            <!-- Large Time Display -->
            <div class="large-time animate-time-tick" id="largeTime">6:22:35 PM</div>

            <!-- Reduced Button -->
            <button class="reduced-button" type="button">Reduced</button>

            <!-- Ticket Card -->
            <div class="ticket-info">
                <div class="ticket-type">Senior/Youth/Medicare Non-Rush Hour</div>
                <div class="ticket-area">Minneapolis/ St. Paul Metro Area</div>
                <div class="ticket-expires">Expires <span class="expires-highlight" id="expiresDate">Nov 24, 2026, 2:00 AM</span></div>
            </div>
        </div>

        <!-- Bottom Bar -->
        <div class="bottom-nav">
            <button class="nav-button" type="button">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
                    <path d="M16 6l-4-4-4 4"></path>
                    <path d="M12 2v15"></path>
                </svg>
                <span class="nav-button-text">Share</span>
            </button>
            <button class="nav-button" type="button">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                </svg>
                <span class="nav-button-text">Favorites</span>
            </button>
            <button class="nav-button" type="button">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M12 16v-4"></path>
                    <path d="M12 8h.01"></path>
                </svg>
                <span class="nav-button-text">Info</span>
            </button>
            <button class="nav-button" type="button">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1 1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
                <span class="nav-button-text">Settings</span>
            </button>
            <button class="nav-button" type="button">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="3,6 5,6 21,6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                </svg>
                <span class="nav-button-text">Delete</span>
            </button>
        </div>
    </div>

    <script>
        let lastSecond = '';

        function updateTimeAndDate() {
            const now = new Date();

            const statusTime = now.toLocaleTimeString('en-US', {
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            });
            document.getElementById('statusTime').textContent = statusTime;

            const navDate = now.toLocaleDateString('en-US', {
                month: 'long',
                day: 'numeric'
            });
            const navTime = now.toLocaleTimeString('en-US', {
                hour: 'numeric',
                minute: '2-digit',
                hour12: true
            });
            document.getElementById('navDate').textContent = navDate;
            document.getElementById('navTime').textContent = navTime;

            const largeTime = now.toLocaleTimeString('en-US', {
                hour: 'numeric',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            });

            const largeTimeElement = document.getElementById('largeTime');
            const currentSecond = now.getSeconds().toString();
            if (currentSecond !== lastSecond) {
                largeTimeElement.textContent = largeTime;
                largeTimeElement.classList.remove('animate-time-tick');
                setTimeout(() => {
                    largeTimeElement.classList.add('animate-time-tick');
                }, 10);
                lastSecond = currentSecond;
            }

            const tomorrow = new Date(now);
            tomorrow.setDate(now.getDate() + 1);
            tomorrow.setHours(2, 0, 0, 0);

            const expiresDate = tomorrow.toLocaleDateString('en-US', {
                month: 'short',
                day: 'numeric',
                year: 'numeric'
            }) + ', ' + tomorrow.toLocaleTimeString('en-US', {
                hour: 'numeric',
                minute: '2-digit',
                hour12: true
            });

            document.getElementById('expiresDate').textContent = expiresDate;
        }

        updateTimeAndDate();
        setInterval(updateTimeAndDate, 1000);

        setTimeout(() => {
            location.reload();
        }, 3600000);

        function openFullscreen() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch(() => {});
            } else if (elem.webkitRequestFullscreen) {
                try {
                    elem.webkitRequestFullscreen();
                } catch (e) {}
            } else if (elem.msRequestFullscreen) {
                try {
                    elem.msRequestFullscreen();
                } catch (e) {}
            }
        }

        document.addEventListener('touchstart', openFullscreen, { once: true });
        document.addEventListener('click', openFullscreen, { once: true });
    </script>
</body>
</html>
