<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Metro Transit - Live Clock</title>
    <link href="css2_PUez.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            font-family: 'Inter', Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #ffffff;
            color: #374151;
            overflow-x: hidden;
        }

        .mobile-container {
            position: relative;
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        /* Top Blue Status Strip inside phone view */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            background: #1d4ed8;
            z-index: 10;
        }

        .status-icons {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .icon {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .battery-icon {
            width: 20px;
            height: 16px;
        }

        .signal-label {
            font-size: 12px;
            font-weight: 500;
        }

        /* Dark Header Bar with X Above Ticket Header */
        .dark-close-bar {
            width: 100%;
            background: #18181b;
            color: #ffffff;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 10px 16px;
        }

        .close-x-btn {
            background: none;
            border: none;
            color: #ffffff;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: default;
            user-select: none;
        }

        /* Main Content */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 16px 22px 20px;
            background: #ffffff;
            flex-grow: 1;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            color: #2f353d;
            margin-bottom: 2px;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }

        .subtitle {
            color: #4b5563;
            margin-bottom: 28px;
            font-size: 15px;
            font-weight: 400;
            line-height: 1.35;
        }

        /* Center Circle + Light-Green Ring Growing Outward in 3 Width Stages */
        .logo-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 32px;
            min-height: 208px;
        }

        .logo-stage {
            position: relative;
            width: 208px;
            height: 208px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .green-grow-ring {
            position: absolute;
            width: 116px;
            height: 116px;
            border-radius: 50%;
            background: radial-gradient(circle, #a3e635 58%, #84cc16 88%, #65a30d 100%);
            opacity: 0.04;
            transform: scale(0.92);
            transform-origin: center center;
            pointer-events: none;
            z-index: 1;
            will-change: transform, opacity;
            animation: threeWidthGrow 10s cubic-bezier(0.25, 0.8, 0.25, 1) infinite;
        }

        .logo-inner {
            position: relative;
            z-index: 3;
            width: 116px;
            height: 116px;
            aspect-ratio: 1 / 1;
            background: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.14);
        }

        .logo-image {
            width: 82px;
            height: 82px;
            object-fit: contain;
            -webkit-touch-callout: none;
            user-select: none;
        }

        /* Large Time Display */
        .large-time {
            width: 100%;
            font-size: 50px;
            font-weight: 800;
            color: #2f353d;
            margin-bottom: 20px;
            font-family: 'Inter', Roboto, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            letter-spacing: -0.025em;
            line-height: 1.05;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        /* Reduced Pill Button */
        .reduced-button {
            width: 100%;
            background: #15803d;
            color: #ffffff;
            font-size: 28px;
            font-weight: 600;
            padding: 12px 28px;
            border-radius: 9999px;
            border: none;
            box-shadow: 0 3px 8px rgba(20, 83, 45, 0.2);
            margin-bottom: 24px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            user-select: none;
        }

        .reduced-button:active {
            background: #166534;
        }

        /* Ticket Card Matching Screenshot Font Size & Spacing */
        .ticket-info {
            width: 100%;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 14px 16px;
            text-align: left;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
        }

        .ticket-type {
            font-size: 18px;
            font-weight: 600;
            color: #2f353d;
            line-height: 1.25;
            margin-bottom: 6px;
        }

        .ticket-area {
            font-size: 12px;
            font-weight: 400;
            color: #6b7280;
            line-height: 1.3;
            margin-bottom: 12px;
        }

        .ticket-expires {
            font-size: 15px;
            font-weight: 700;
            color: #374151;
            line-height: 1.3;
        }

        .expires-highlight {
            font-weight: 700;
            color: #374151;
        }

        /* Clean Blue Bottom Strip Without Labels/Icons */
        .bottom-nav {
            width: 100%;
            min-height: 44px;
            background: #1d4ed8;
        }

        /* Almost invisible / shrunk -> Width 1 (a little wide) -> Width 2 (medium wide) -> Width 3 (larger wide) -> shrink back */
        @keyframes threeWidthGrow {
            0% {
                transform: scale(0.92);
                opacity: 0.05;
            }
            16% {
                transform: scale(1.24);
                opacity: 0.92;
            }
            24% {
                transform: scale(1.24);
                opacity: 0.85;
            }
            42% {
                transform: scale(1.48);
                opacity: 0.95;
            }
            50% {
                transform: scale(1.48);
                opacity: 0.88;
            }
            70% {
                transform: scale(1.74);
                opacity: 0.96;
            }
            82% {
                transform: scale(1.74);
                opacity: 0.25;
            }
            94% {
                transform: scale(0.95);
                opacity: 0.04;
            }
            100% {
                transform: scale(0.92);
                opacity: 0.05;
            }
        }

        @keyframes fadeAndScale {
            0% {
                opacity: 0.88;
                transform: scale(0.99);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .animate-time-tick {
            animation: fadeAndScale 0.35s ease-out;
        }

        @media (max-width: 390px) {
            .logo-stage {
                width: 196px;
                height: 196px;
            }

            .green-grow-ring,
            .logo-inner {
                width: 108px;
                height: 108px;
            }

            .logo-image {
                width: 76px;
                height: 76px;
            }

            .large-time {
                font-size: 46px;
            }

            .reduced-button {
                font-size: 25px;
            }

            .ticket-type {
                font-size: 17px;
            }
        }
    </style>
</head>
<body>
    <div class="mobile-container">
        <!-- Top Bar -->
        <div class="status-bar">
            <span id="statusTime">18:22</span>
            <div class="status-icons">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M2 17h20v2H2zm1.15-4.05L4 11.47l.85 1.48L3.15 12.95zm3.7-3.7L8 8.47l1.15 1.48L7.85 9.25zm3.7-3.7L12 4.47l1.15 1.48L11.85 5.55zm3.7-3.7L16 .47l1.15 1.48L15.85 1.85z"></path>
                </svg>
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
                    <path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
                    <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                    <path d="M12 20h.01"></path>
                </svg>
                <span class="signal-label">5G</span>
                <svg class="battery-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="1" y="6" width="18" height="12" rx="2" ry="2"></rect>
                    <path d="M23 13v-2"></path>
                    <rect x="3" y="8" width="14" height="8" rx="1" ry="1" fill="currentColor"></rect>
                </svg>
            </div>
        </div>

        <!-- Dark Header Strip with X Above Ticket Title -->
        <div class="dark-close-bar">
            <button class="close-x-btn" type="button" aria-label="Close">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                    <path d="M18 6L6 18"></path>
                    <path d="M6 6l12 12"></path>
                </svg>
            </button>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <h1 class="title">Metro Transit</h1>
            <p class="subtitle">Show operator your ticket</p>

            <!-- Growing Light-Green Ring Around Center Logo -->
            <div class="logo-wrapper">
                <div class="logo-stage">
                    <span class="green-grow-ring" aria-hidden="true"></span>
                    <div class="logo-inner">
                        <img src="go_to_logo_PUez.png" alt="Go To Logo" class="logo-image">
                    </div>
                </div>
            </div>

            <!-- Large Time Display -->
            <div class="large-time animate-time-tick" id="largeTime">6:22:35 PM</div>

            <!-- Reduced Button -->
            <button class="reduced-button" type="button">Reduced</button>

            <!-- Ticket Card -->
            <div class="ticket-info">
                <div class="ticket-type">Senior/Youth/Medicare Non-Rush Hour</div>
                <div class="ticket-area">Minneapolis/ St. Paul Metro Area</div>
                <div class="ticket-expires">Expires <span class="expires-highlight" id="expiresDate">Nov 24, 2026, 2:00 AM</span></div>
            </div>
        </div>

        <!-- Clean Blue Bottom Strip -->
        <div class="bottom-nav"></div>
    </div>

    <script>
        let lastSecond = '';

        function updateTimeAndDate() {
            const now = new Date();

            const statusTime = now.toLocaleTimeString('en-US', {
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            });
            const statusEl = document.getElementById('statusTime');
            if (statusEl) statusEl.textContent = statusTime;

            const largeTime = now.toLocaleTimeString('en-US', {
                hour: 'numeric',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            });

            const largeTimeElement = document.getElementById('largeTime');
            const currentSecond = now.getSeconds().toString();
            if (largeTimeElement && currentSecond !== lastSecond) {
                largeTimeElement.textContent = largeTime;
                largeTimeElement.classList.remove('animate-time-tick');
                setTimeout(() => {
                    largeTimeElement.classList.add('animate-time-tick');
                }, 10);
                lastSecond = currentSecond;
            }

            const tomorrow = new Date(now);
            tomorrow.setDate(now.getDate() + 1);
            tomorrow.setHours(2, 0, 0, 0);

            const expiresDate = tomorrow.toLocaleDateString('en-US', {
                month: 'short',
                day: 'numeric',
                year: 'numeric'
            }) + ', ' + tomorrow.toLocaleTimeString('en-US', {
                hour: 'numeric',
                minute: '2-digit',
                hour12: true
            });

            const expiresEl = document.getElementById('expiresDate');
            if (expiresEl) expiresEl.textContent = expiresDate;
        }

        updateTimeAndDate();
        setInterval(updateTimeAndDate, 1000);

        setTimeout(() => {
            location.reload();
        }, 3600000);

        function openFullscreen() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch(() => {});
            } else if (elem.webkitRequestFullscreen) {
                try {
                    elem.webkitRequestFullscreen();
                } catch (e) {}
            } else if (elem.msRequestFullscreen) {
                try {
                    elem.msRequestFullscreen();
                } catch (e) {}
            }
        }

        document.addEventListener('touchstart', openFullscreen, { once: true });
        document.addEventListener('click', openFullscreen, { once: true });
    </script>
</body>
</html>
